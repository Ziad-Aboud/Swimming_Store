<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile — Swimming Store</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Playfair+Display:wght@700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/auth.css">
</head>
<body>
    <div class="top-bar">
        <div class="container top-bar-inner">
            <span><i class="fas fa-shipping-fast"></i> Free shipping on orders over $100</span>
            <div class="top-bar-right"><button id="theme-toggle" class="theme-btn"><i class="fas fa-moon"></i></button></div>
        </div>
    </div>

    <nav class="navbar" id="navbar">
        <div class="container nav-inner">
            <a href="../index.html" class="logo"><i class="fas fa-water"></i> SWIMMING<span>STORE</span></a>
            <ul class="nav-links" id="navLinks">
                <li><a href="../index.html">Home</a></li>
                <li><a href="shop.html">Shop</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
            <div class="nav-actions">
                <a href="wishlist.html" class="nav-icon"><i class="fas fa-heart"></i><span class="badge" id="wishBadge">0</span></a>
                <a href="cart.html" class="nav-icon"><i class="fas fa-shopping-bag"></i><span class="badge" id="cartBadge">0</span></a>
                <button class="hamburger" id="hamburger"><span></span><span></span><span></span></button>
            </div>
        </div>
    </nav>

    <div class="container profile-page">
        <div class="profile-layout">
            <div class="profile-sidebar">
                <div class="profile-avatar" id="profileInitials">JD</div>
                <h3 id="profileName">John Doe</h3>
                <p id="profileEmail">john.doe@email.com</p>
                <nav class="profile-nav">
                    <a href="profile.html" class="active"><i class="fas fa-user"></i> My Profile</a>
                    <a href="orders.html"><i class="fas fa-box"></i> My Orders</a>
                    <a href="wishlist.html"><i class="fas fa-heart"></i> Wishlist</a>
                    <a href="addresses.html"><i class="fas fa-map-marker-alt"></i> Addresses</a>
                    <a href="#"><i class="fas fa-credit-card"></i> Payment</a>
                    <a href="#" onclick="event.preventDefault(); logoutUser();" class="logout-btn">
                        <i class="fas fa-sign-out-alt"></i> Logout
                    </a>
                </nav>
            </div>

            <div class="profile-content">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px;">
                    <h2>Payment Methods</h2>
                    <button id="showCardFormBtn" class="btn btn-primary" style="padding: 8px 16px; font-size: 0.9rem;">+ Add New Card</button>
                </div>

                <div id="paymentsContainer" style="display: grid; grid-template-columns: 1fr; gap: 20px; margin-bottom: 30px;">
                    <div style="text-align: center; padding: 40px; color: #666;"><i class="fas fa-spinner fa-spin fa-2x"></i></div>
                </div>

                <div id="cardFormContainer" style="display: none; background: #f8f9fb; padding: 24px; border-radius: 12px; border: 1px solid #eaeaea;">
                    <h3 style="margin-bottom: 16px;">Add New Card</h3>
                    <form id="newCardForm">
                        <div class="form-group">
                            <label>Card Number (16 Digits)</label>
                            <input type="text" id="cardNumber" class="form-control" placeholder="1234567890123456" maxlength="16" required>
                        </div>
                        <div class="form-row" style="display: flex; gap: 16px;">
                            <div class="form-group" style="flex: 1;">
                                <label>Expiry Date (MM/YY)</label>
                                <input type="text" id="cardExpiry" class="form-control" placeholder="12/26" maxlength="5" required>
                            </div>
                            <div class="form-group" style="flex: 1;">
                                <label>CVC (3 Digits)</label>
                                <input type="text" id="cardCVC" class="form-control" placeholder="123" maxlength="4" required>
                            </div>
                        </div>
                        <div class="form-group">
                            <label style="display:flex; align-items:center; cursor:pointer;">
                                <input type="checkbox" id="cardDefault" style="margin-right:8px; width:auto;"> Set as default payment method
                            </label>
                        </div>
                        <div id="formErrorMsg" style="color: #ef4444; font-size: 0.85rem; margin-bottom: 15px; display: none;"></div>
                        <div style="display: flex; gap: 10px;">
                            <button type="submit" class="btn btn-primary">Save Card</button>
                            <button type="button" id="cancelCardBtn" class="btn" style="background: #e2e8f0; color: #475569;">Cancel</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <footer class="footer">
        <div class="container"><div class="footer-bottom" style="border:none"><p>&copy; 2025 Swimming Store.</p></div></div>
    </footer>
    <script src="../js/main.js"></script>
    <script src="../js/main.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            if (!CURRENT_USER_ID) { window.location.href = 'login.html'; return; }

            if (currentUser) {
                document.getElementById('profileName').textContent = currentUser.first_name + (currentUser.last_name ? ' ' + currentUser.last_name : '');
                if (currentUser.email) document.getElementById('profileEmail').textContent = currentUser.email;
                document.getElementById('profileInitials').textContent = currentUser.first_name.charAt(0).toUpperCase();
            }

            document.querySelectorAll('.profile-nav a').forEach(link => {
                if(link.innerHTML.includes('Payment')) { link.classList.add('active'); link.href="payment.html"; }
                else { link.classList.remove('active'); }
            });

            const container = document.getElementById('paymentsContainer');
            const formContainer = document.getElementById('cardFormContainer');
            const errorMsg = document.getElementById('formErrorMsg');
            
            document.getElementById('showCardFormBtn').addEventListener('click', () => formContainer.style.display = 'block');
            document.getElementById('cancelCardBtn').addEventListener('click', () => {
                formContainer.style.display = 'none';
                document.getElementById('newCardForm').reset();
                errorMsg.style.display = 'none';
            });

            async function loadPayments() {
                try {
                    const res = await fetch(`${API_BASE_URL}/payments/${CURRENT_USER_ID}/`);
                    const data = await res.json();
                    
                    if (data.payments.length === 0) {
                        container.innerHTML = `<div style="text-align:center; color:#666; padding: 20px;">No payment methods saved.</div>`;
                        return;
                    }

                    container.innerHTML = data.payments.map(card => `
                        <div style="border: 1px solid ${card.is_default ? 'var(--primary)' : '#eaeaea'}; border-radius: 8px; padding: 20px; position:relative; background:white; display:flex; align-items:center; gap: 20px;">
                            <div style="font-size: 2rem; color: #1e293b;"><i class="fab fa-cc-visa"></i></div>
                            <div style="flex: 1;">
                                <h4 style="margin-bottom:4px;">•••• •••• •••• ${card.last_four}</h4>
                                <p style="color:#666; font-size:0.9rem; margin:0;">Expires: ${card.expiry_date}</p>
                            </div>
                            
                            ${card.is_default ? 
                                '<span style="background:var(--primary); color:white; font-size:0.75rem; padding:4px 10px; border-radius:12px; font-weight:600;">Default</span>' : 
                                `<button onclick="setDefault(${card.payment_id})" style="background:#f1f5f9; border:none; color:#64748b; font-size:0.75rem; padding:6px 12px; border-radius:12px; cursor:pointer; font-weight:600;">Set Default</button>`
                            }
                            
                            <button onclick="deleteCard(${card.payment_id})" style="background:none; border:none; color:#ef4444; font-size:1.1rem; cursor:pointer; margin-left:10px;"><i class="fas fa-trash-alt"></i></button>
                        </div>
                    `).join('');
                } catch (error) {
                    container.innerHTML = '<p style="color:red;">Failed to load cards.</p>';
                }
            }

            window.setDefault = async (id) => {
                await fetch(`${API_BASE_URL}/payments/default/${CURRENT_USER_ID}/${id}/`, { method: 'PUT' });
                loadPayments();
            };

            window.deleteCard = async (id) => {
                if(!confirm("Delete this card?")) return;
                await fetch(`${API_BASE_URL}/payments/delete/${id}/`, { method: 'DELETE' });
                loadPayments();
            };

            // STRICT INPUT VALIDATION
            document.getElementById('newCardForm').addEventListener('submit', async (e) => {
                e.preventDefault();
                errorMsg.style.display = 'none';
                
                const num = document.getElementById('cardNumber').value.trim();
                const exp = document.getElementById('cardExpiry').value.trim();
                const cvc = document.getElementById('cardCVC').value.trim();

                // 1. Validate 16 Digits
                if (!/^\d{16}$/.test(num)) {
                    errorMsg.textContent = "Card number must be exactly 16 digits.";
                    errorMsg.style.display = 'block'; return;
                }
                
                // 2. Validate MM/YY Date
                if (!/^(0[1-9]|1[0-2])\/\d{2}$/.test(exp)) {
                    errorMsg.textContent = "Expiry must be in MM/YY format (e.g., 05/26).";
                    errorMsg.style.display = 'block'; return;
                }

                // 3. Validate CVC
                if (!/^\d{3,4}$/.test(cvc)) {
                    errorMsg.textContent = "CVC must be 3 or 4 digits.";
                    errorMsg.style.display = 'block'; return;
                }
                
                try {
                    const res = await fetch(`${API_BASE_URL}/payments/${CURRENT_USER_ID}/`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            card_number: num,
                            expiry_date: exp,
                            cvc: cvc,
                            is_default: document.getElementById('cardDefault').checked
                        })
                    });

                    if (res.ok) {
                        showToast('Card saved!', 'success');
                        document.getElementById('newCardForm').reset();
                        formContainer.style.display = 'none';
                        loadPayments();
                    }
                } catch (error) {
                    console.error(error);
                }
            });

            loadPayments();
        });
    </script>
</body>
</html>
