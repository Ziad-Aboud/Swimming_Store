<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile — Swimming Store</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Playfair+Display:wght@700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/auth.css">
</head>
<body>
    <div class="top-bar">
        <div class="container top-bar-inner">
            <span><i class="fas fa-shipping-fast"></i> Free shipping on orders over $100</span>
            <div class="top-bar-right"><button id="theme-toggle" class="theme-btn"><i class="fas fa-moon"></i></button></div>
        </div>
    </div>

    <nav class="navbar" id="navbar">
        <div class="container nav-inner">
            <a href="../index.html" class="logo"><i class="fas fa-water"></i> SWIMMING<span>STORE</span></a>
            <ul class="nav-links" id="navLinks">
                <li><a href="../index.html">Home</a></li>
                <li><a href="shop.html">Shop</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
            <div class="nav-actions">
                <a href="wishlist.html" class="nav-icon"><i class="fas fa-heart"></i><span class="badge" id="wishBadge">0</span></a>
                <a href="cart.html" class="nav-icon"><i class="fas fa-shopping-bag"></i><span class="badge" id="cartBadge">0</span></a>
                <button class="hamburger" id="hamburger"><span></span><span></span><span></span></button>
            </div>
        </div>
    </nav>

    <div class="container profile-page">
        <div class="profile-layout">
            <div class="profile-sidebar">
                <div class="profile-avatar" id="profileInitials">JD</div>
                <h3 id="profileName">John Doe</h3>
                <p id="profileEmail">john.doe@email.com</p>
                <nav class="profile-nav">
                    <a href="profile.html" class="active"><i class="fas fa-user"></i> My Profile</a>
                    <a href="orders.html"><i class="fas fa-box"></i> My Orders</a>
                    <a href="wishlist.html"><i class="fas fa-heart"></i> Wishlist</a>
                    <a href="#"><i class="fas fa-map-marker-alt"></i> Addresses</a>
                    <a href="payment.html"><i class="fas fa-credit-card"></i> Payment</a>
                    <a href="#" onclick="event.preventDefault(); logoutUser();" class="logout-btn">
                        <i class="fas fa-sign-out-alt"></i> Logout
                    </a>
                </nav>
            </div>

            <div class="profile-content">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px;">
                    <h2>My Addresses</h2>
                    <button id="showAddressFormBtn" class="btn btn-primary" style="padding: 8px 16px; font-size: 0.9rem;">+ Add New Address</button>
                </div>

                <div id="addressesContainer" style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 30px;">
                    <div style="text-align: center; grid-column: 1/-1; padding: 40px; color: #666;">
                        <i class="fas fa-spinner fa-spin fa-2x"></i>
                        <p>Loading addresses...</p>
                    </div>
                </div>

                <div id="addressFormContainer" style="display: none; background: #f8f9fb; padding: 24px; border-radius: 12px; border: 1px solid #eaeaea;">
                    <h3 style="margin-bottom: 16px;">Add New Address</h3>
                    <form id="newAddressForm">
                        <div class="form-group">
                            <label>Street Address</label>
                            <input type="text" id="addrStreet" class="form-control" placeholder="e.g., 123 Nile Street, Apt 4" required>
                        </div>
                        <div class="form-row">
                            <div class="form-group">
                                <label>City</label>
                                <input type="text" id="addrCity" class="form-control" placeholder="e.g., Sheikh Zayed City" required>
                            </div>
                            <div class="form-group">
                                <label>State / Province</label>
                                <input type="text" id="addrState" class="form-control" placeholder="e.g., Giza Governorate" required>
                            </div>
                        </div>
                        <div class="form-row">
                            <div class="form-group">
                                <label>Postal Code</label>
                                <input type="text" id="addrZip" class="form-control" placeholder="e.g., 12588" required>
                            </div>
                            <div class="form-group">
                                <label>Country</label>
                                <input type="text" id="addrCountry" class="form-control" value="Egypt" required>
                            </div>
                        </div>
                        <div class="form-group">
                            <label style="display:flex; align-items:center; cursor:pointer;">
                                <input type="checkbox" id="addrDefault" style="margin-right:8px; width:auto;"> 
                                Set as default shipping address
                            </label>
                        </div>
                        <div style="display: flex; gap: 10px; margin-top: 16px;">
                            <button type="submit" class="btn btn-primary">Save Address</button>
                            <button type="button" id="cancelAddressBtn" class="btn" style="background: #e2e8f0; color: #475569;">Cancel</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <footer class="footer">
        <div class="container"><div class="footer-bottom" style="border:none"><p>&copy; 2025 Swimming Store.</p></div></div>
    </footer>
    <script src="../js/main.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            if (!CURRENT_USER_ID) { window.location.href = 'login.html'; return; }

            // 1. Sidebar Setup
            if (currentUser) {
                document.getElementById('profileName').textContent = currentUser.first_name + (currentUser.last_name ? ' ' + currentUser.last_name : '');
                if (currentUser.email) document.getElementById('profileEmail').textContent = currentUser.email;
                document.getElementById('profileInitials').textContent = currentUser.first_name.charAt(0).toUpperCase();
            }

            // 2. Make sure the sidebar links point to the right HTML file!
            document.querySelectorAll('.profile-nav a').forEach(link => {
                if(link.innerHTML.includes('Addresses')) { link.classList.add('active'); link.href="addresses.html"; }
                else { link.classList.remove('active'); }
            });

            const container = document.getElementById('addressesContainer');
            const formContainer = document.getElementById('addressFormContainer');
            
            // 3. UI Toggles for the Form
            document.getElementById('showAddressFormBtn').addEventListener('click', () => {
                formContainer.style.display = 'block';
            });
            document.getElementById('cancelAddressBtn').addEventListener('click', () => {
                formContainer.style.display = 'none';
                document.getElementById('newAddressForm').reset();
            });

            // 6. Delete Address Function
            window.deleteAddress = async function(addressId) {
                if (!confirm("Are you sure you want to delete this address?")) return;
                
                try {
                    const res = await fetch(`${API_BASE_URL}/addresses/delete/${addressId}/`, {
                        method: 'DELETE'
                    });
                    
                    const data = await res.json(); 
                    
                    if (res.ok) {
                        showToast('Address deleted!', 'success');
                        loadAddresses(); 
                    } else {
                        showToast(data.error || 'Failed to delete address', 'error');
                    }
                } catch (error) {
                    console.error("Error deleting address:", error);
                    showToast('Network error occurred.', 'error');
                }
            };
            
            // 4. Fetch Addresses from Django
            async function loadAddresses() {
                try {
                    const res = await fetch(`${API_BASE_URL}/addresses/${CURRENT_USER_ID}/`);
                    const data = await res.json();
                    
                    if (data.addresses.length === 0) {
                        container.innerHTML = `<div style="grid-column: 1/-1; text-align:center; color:#666; padding: 20px;">No addresses saved yet. Add one below!</div>`;
                        return;
                    }

                    container.innerHTML = data.addresses.map(addr => `
                        <div style="border: 1px solid ${addr.is_default ? 'var(--primary)' : '#eaeaea'}; border-radius: 8px; padding: 20px; position:relative; background:white; transition: 0.3s;">
                            ${addr.is_default ? 
                                '<span style="position:absolute; top:10px; right:10px; background:var(--primary); color:white; font-size:0.7rem; padding:3px 8px; border-radius:12px;">Default</span>' : 
                                `<button onclick="setDefaultAddress(${addr.address_id})" style="position:absolute; top:10px; right:10px; background:#f1f5f9; border:none; color:#64748b; font-size:0.7rem; padding:4px 10px; border-radius:12px; cursor:pointer; font-weight:600;">Set as Default</button>`
                            }
                            
                            <button onclick="deleteAddress(${addr.address_id})" style="position:absolute; bottom:15px; right:15px; background:none; border:none; color:#ef4444; font-size:1.1rem; cursor:pointer;" title="Delete Address">
                                <i class="fas fa-trash-alt"></i>
                            </button>

                            <h4 style="margin-bottom:8px; font-size:1.1rem;"><i class="fas fa-map-marker-alt" style="color:var(--primary); margin-right:8px;"></i>${addr.city}</h4>
                            <p style="color:#666; font-size:0.9rem; line-height:1.5;">
                                ${addr.street_address}<br>
                                ${addr.state}, ${addr.postal_code}<br>
                                ${addr.country}
                            </p>
                        </div>
                    `).join('');

                } catch (error) {
                    container.innerHTML = '<p style="color:red; grid-column:1/-1;">Failed to load addresses.</p>';
                }
            }

            // 5. Submit New Address
            document.getElementById('newAddressForm').addEventListener('submit', async (e) => {
                e.preventDefault();
                
                try {
                    const res = await fetch(`${API_BASE_URL}/addresses/${CURRENT_USER_ID}/`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            street_address: document.getElementById('addrStreet').value,
                            city: document.getElementById('addrCity').value,
                            state: document.getElementById('addrState').value,
                            postal_code: document.getElementById('addrZip').value,
                            country: document.getElementById('addrCountry').value,
                            is_default: document.getElementById('addrDefault').checked
                        })
                    });

                    if (res.ok) {
                        showToast('Address saved successfully!', 'success');
                        document.getElementById('newAddressForm').reset();
                        formContainer.style.display = 'none';
                        loadAddresses(); 
                    } else {
                        showToast('Failed to save address', 'error');
                    }
                } catch (error) {
                    console.error(error);
                }
            });

            loadAddresses();

                        // 7. Set Default Address Function
            window.setDefaultAddress = async function(addressId) {
                try {
                    const res = await fetch(`${API_BASE_URL}/addresses/default/${CURRENT_USER_ID}/${addressId}/`, {
                        method: 'PUT',
                        headers: { 'Content-Type': 'application/json' }
                    });
                    
                    if (res.ok) {
                        showToast('Default address updated!', 'success');
                        loadAddresses(); 
                    } else {
                        showToast('Failed to update default address', 'error');
                    }
                } catch (error) {
                    console.error("Error setting default address:", error);
                }
            };
        });
    </script>
</body>
</html>
