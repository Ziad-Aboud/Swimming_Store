<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register — Swimming Store</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Playfair+Display:wght@700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/auth.css">
</head>
<body>
    <nav class="navbar" id="navbar">
        <div class="container nav-inner">
            <a href="../index.html" class="logo"><i class="fas fa-water"></i> SWIMMING<span>STORE</span></a>
            <div class="nav-actions">
                <button id="theme-toggle" class="theme-btn"><i class="fas fa-moon"></i></button>
            </div>
        </div>
    </nav>

    <div class="auth-page">
        <div class="auth-card">
            <div class="auth-logo">
                <a href="../index.html"><i class="fas fa-water"></i> SWIMMING<span>STORE</span></a>
            </div>
            <h2>Create Account</h2>
            <p class="auth-sub">Join Swimming Store today</p>

            

            <div class="auth-divider">register with email</div>

            <form id="registerForm">
                <div class="form-row">
                    <div class="form-group"><label>First Name</label><input type="text" id="regFirstName" class="form-control" placeholder="John" required></div>
                    <div class="form-group"><label>Last Name</label><input type="text" id="regLastName" class="form-control" placeholder="Doe" required></div>
                </div>
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" id="regEmail" class="form-control" placeholder="you@example.com" required>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="regPassword" class="form-control" placeholder="Min 8 characters" required>
                </div>
                <div class="form-group">
                    <label>Confirm Password</label>
                    <input type="password" id="regConfirmPassword" class="form-control" placeholder="Confirm password" required>
                </div>
                <div class="form-group">
                    <label>
                        <input type="checkbox" style="margin-right:8px" required>
                        I agree to the <a href="#" style="color:var(--primary)">Terms of Service</a>
                    </label>
                </div>
                <button type="submit" class="btn btn-primary btn-lg">Create Account <i class="fas fa-arrow-right"></i></button>
            </form>

            <p class="auth-footer">Already have an account? <a href="login.html">Sign In</a></p>
        </div>
    </div>

    <script src="../js/main.js"></script>
</body>
</html>
