<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — Swimming Store</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Playfair+Display:wght@700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/auth.css">
</head>
<body>
    <nav class="navbar" id="navbar">
        <div class="container nav-inner">
            <a href="../index.html" class="logo"><i class="fas fa-water"></i> SWIMMING<span>STORE</span></a>
            <div class="nav-actions">
                <button id="theme-toggle" class="theme-btn"><i class="fas fa-moon"></i></button>
            </div>
        </div>
    </nav>

    <div class="auth-page">
        <div class="auth-card">
            <div class="auth-logo">
                <a href="../index.html"><i class="fas fa-water"></i> SWIMMING<span>STORE</span></a>
            </div>
            <h2>Welcome Back</h2>

            <div class="auth-divider">sign in with email</div>

            <form id="loginForm">
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" id="loginEmail" class="form-control" placeholder="you@example.com" required>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <div class="password-wrapper">
                        <input type="password" class="form-control" placeholder="••••••••" required id="loginPassword">
                        <button type="button" class="password-toggle"
                            onclick="const i=document.getElementById('loginPassword');i.type=i.type==='password'?'text':'password';this.querySelector('i').className=i.type==='password'?'fas fa-eye':'fas fa-eye-slash'">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                </div>
                <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;font-size:0.9rem">
                    <label><input type="checkbox" style="margin-right:6px"> Remember me</label>
                    <a href="#" style="color:var(--primary);font-weight:600">Forgot password?</a>
                </div>
                <button type="submit" class="btn btn-primary btn-lg">Sign In <i class="fas fa-arrow-right"></i></button>
            </form>

            <p class="auth-footer">Don't have an account? <a href="register.html">Sign Up</a></p>
        </div>
    </div>

    <script src="../js/main.js"></script>
</body>
</html>
